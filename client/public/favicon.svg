<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="novaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="50%" style="stop-color:#0f766e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#novaGrad)" opacity="0.95"/>

  <!-- Shopping cart base -->
  <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cart body -->
    <path d="M16 20h4l4 20h20l4-14H24" stroke-width="2.5"/>
    <!-- Cart wheels -->
    <circle cx="26" cy="48" r="2.5" fill="#fff"/>
    <circle cx="42" cy="48" r="2.5" fill="#fff"/>
  </g>

  <!-- Nova star accent -->
  <g fill="url(#starGrad)">
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" opacity="0.95"/>
  </g>

  <!-- Small sparkle accents -->
  <circle cx="20" cy="12" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="56" cy="36" r="1" fill="#fff" opacity="0.6"/>
</svg>